        function issueCollectivePZ() {
            const supplierSelect = document.getElementById('supplier-select');
            const selectedSupplier = supplierSelect ? supplierSelect.value : "";

            if(!selectedSupplier) {
                return alert("Wybierz dostawcę z listy zgodnie z treścią zadania logistycznego!");
            }

            const itemSelects = document.querySelectorAll('.pz-item-select');
            const codeInputs = document.querySelectorAll('.pz-code-input');
            const wzInputs = document.querySelectorAll('.pz-wz-input');
            const pzInputs = document.querySelectorAll('.pz-pz-input');
            const priceInputs = document.querySelectorAll('.pz-price-input');
            const qualSelects = document.querySelectorAll('.pz-qual-select');

            const rowData = [];

            for(let i = 0; i < itemSelects.length; i++) {
                const itemIdxVal = itemSelects[i].value;
                const codeVal = codeInputs[i].value.trim();
                const wzVal = wzInputs[i].value;
                const pzVal = pzInputs[i].value;
                const priceVal = priceInputs[i].value;
                const qualVal = qualSelects[i].value;

                if(itemIdxVal === "" || codeVal === "" || wzVal === "" || pzVal === "" || priceVal === "") {
                    return alert(`Wypełnij wszystkie pola dla pozycji #${i+1}!`);
                }

                const catalogItem = masterCatalog[parseInt(itemIdxVal)];
                const wzQty = parseInt(wzVal);
                const pzQty = parseInt(pzVal);
                const netPrice = parseFloat(priceVal);

                if(isNaN(wzQty) || wzQty < 0 || isNaN(pzQty) || pzQty < 0 || isNaN(netPrice) || netPrice < 0) {
                    return alert(`Podaj poprawne wartości liczbowe dla pozycji #${i+1}!`);
                }

                const totalNetValue = pzQty * netPrice;

                rowData.push({
                    id: `item-${i}-${Date.now()}`,
                    index: catalogItem.index,
                    name: catalogItem.name,
                    unit: catalogItem.unit,
                    code: codeVal,
                    wzQty: wzQty,
                    pzQty: pzQty,
                    netPrice: netPrice,
                    totalNetValue: totalNetValue,
                    quality: qualVal
                });

                if(pzQty > 0) {
                    inventory.push({
                        id: `inv-${i}-${Date.now()}`,
                        index: catalogItem.index,
                        name: catalogItem.name,
                        qty: pzQty,
                        unit: catalogItem.unit,
                        zone: codeVal.substring(0, 1).toUpperCase() === 'A' ? 'Strefa A' : (codeVal.substring(0, 1).toUpperCase() === 'B' ? 'Strefa B' : 'Strefa C'),
                        code: codeVal,
                        sourceGroup: currentGroup,
                        netPrice: netPrice,
                        quality: qualVal
                    });
                }
            }

            const pzNum = `PZ/${new Date().getFullYear()}/${Math.floor(1000 + Math.random() * 9000)}`;
            const pzRecord = {
                pzNumber: pzNum,
                group: currentGroup,
                supplier: selectedSupplier,
                items: rowData,
                op1: op1Name,
                op2: op2Name,
                approver: `Kierownik Magazynu (Smakołyk)`,
                date: new Date().toLocaleString()
            };

            pzHistory.push(pzRecord);
            saveState();
            savedPZFormState = { supplier: '', rows: [] };
            render();
            printPZ(pzNum);
        }

        function capturePickFormState() {

                    qtyVal: qtyInputs[i] ? qtyInputs[i].value : '',

        function handlePick(e) {
            e.preventDefault();
            const client = document.getElementById('client-select').value;
            const address = document.getElementById('client-address').value;
            const transport = document.getElementById('transport-vehicle').value;
            const carrier = document.getElementById('pick-carrier').value;

            const selects = document.querySelectorAll('.pick-item-select');
            const qtyInputs = document.querySelectorAll('.pick-qty-input');
            const priceInputs = document.querySelectorAll('.pick-price-input');

            const pickedItems = [];

            for(let i = 0; i < selects.length; i++) {
                const indexVal = selects[i].value;
                const qtyVal = parseInt(qtyInputs[i].value);
                const priceVal = parseFloat(priceInputs[i].value);

                if(!indexVal && indexVal !== "0") return alert(`Wybierz towar dla pozycji #${i+1}`);
                if(isNaN(qtyVal) || qtyVal <= 0) return alert(`Podaj poprawną ilość dla pozycji #${i+1}`);
                if(isNaN(priceVal) || priceVal < 0) return alert(`Podaj poprawną cenę sprzedaży z marżą dla pozycji #${i+1}`);

                const stockItem = inventory[parseInt(indexVal)];
                if(!stockItem) return alert(`Błąd wyboru towaru dla pozycji #${i+1}`);

                if(qtyVal > stockItem.qty) {
                    alert(`⚠️ OSTRZEŻENIE O BRAKU ZAPASU!\n\nPróbujesz pobrać ${qtyVal} ${stockItem.unit} towaru '${stockItem.name}', ale w magazynie centralnym jest dostępnych tylko ${stockItem.qty} ${stockItem.unit}.`);
                    return;
                }

                const totalSellingNetValue = priceVal * qtyVal;

                pickedItems.push({
                    stockIndex: parseInt(indexVal),
                    index: stockItem.index || 'IND-???',
                    name: stockItem.name,
                    qty: qtyVal,
                    unit: stockItem.unit,
                    code: stockItem.code,
                    netPrice: priceVal,
                    totalNetValue: totalSellingNetValue
                });
            }

            for(let item of pickedItems) {
                const stockItem = inventory[item.stockIndex];
                if(stockItem) {
                    stockItem.qty -= item.qty;
                }
            }
            inventory = inventory.filter(i => i.qty > 0);

                date: new Date().toLocaleString()
            };

            const preview = document.getElementById('label-preview');

            preview.innerHTML = `

                    <div class="border-b border-black pb-1 flex justify-between items-center">
                        <div>
                            <strong class="text-xs block">Smakołyk Sp. z o.o., Lubawa</strong>
                            <span class="text-[9px]">ETYKIETA LOGISTYCZNA & ZBIORCZE WZ</span>
                        </div>
                        <span class="font-bold text-sm">${carrier}</span>
                    </div>
                    <div>
                        <span class="text-[10px] text-gray-500 block">ODBIORCA I ADRES DOSTAWY:</span>
                        <strong class="text-xs block uppercase">${client}</strong>
                        <span class="text-[10px]">${address}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-1 border-t border-b border-gray-300 py-1">
                        <div>
                            <span class="text-[10px] text-gray-500 block">TRANSPORT / LIST:</span>
                            <strong>${transport}</strong><br>
                            <span class="text-[9px] text-blue-800">LP: ${waybillNo}</span>
                        </div>
                        <div>
                            <span class="text-[10px] text-gray-500 block">DOKUMENT WZ:</span>
                            <strong class="text-blue-700">${wzNumber}</strong>
                        </div>
                    </div>
                    <div>
                        <span class="text-[10px] text-gray-500 block mb-1">POBRANE ASORTYMENTY Z REGAŁÓW:</span>
                        <ul class="space-y-1">
                            ${pickedItems.map(pi => `
                                <li class="text-[11px]">
                                    • <strong class="text-amber-800">[${pi.index}]</strong> <strong>${pi.name}</strong> - ${pi.qty} ${pi.unit} <span class="bg-yellow-200 px-1 font-bold">(Regał: ${pi.code})</span><br>
                                    <span class="text-[9px] text-gray-600">Cena jedn. netto (z marżą): ${pi.netPrice.toFixed(2)} zł | Wartość: ${pi.totalNetValue.toFixed(2)} zł</span>

            document.getElementById('print-modal').classList.remove('hidden');
        }

        function renderWydanie(container) {
            container.innerHTML = `
                <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
                    <h2 class="text-lg font-bold text-white flex items-center gap-2">
                        <i data-lucide="file-text" class="text-blue-400"></i> Rejestr Dokumentów Wydania Zewnętrznego (WZ)
                    </h2>
                    <p class="text-sm text-slate-400">Wszystkie wydane dokumenty WZ z uwzględnieniem cen sprzedaży netto (z marżą).</p>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm border-collapse">
                            <thead>
                                <tr class="bg-slate-900/50 text-slate-400">
                                    <th class="p-3">Nr WZ / List</th>
                                    <th class="p-3">Klient i Adres</th>
                                    <th class="p-3">Transport</th>
                                    <th class="p-3">Towary, Indeksy i Wartości</th>
                                    <th class="p-3">Magazynierzy</th>
                                    <th class="p-3">Akcje</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-700">
                                ${wzHistory.length === 0 ? '<tr><td colspan="6" class="p-4 text-center text-slate-500">Brak wystawionych dokumentów WZ.</td></tr>' : ''}
                                ${wzHistory.map(wz => `
                                    <tr>
                                        <td class="p-3 font-mono text-xs">
                                            <span class="text-blue-400 font-bold block">${wz.wzNumber}</span>
                                            <span class="text-slate-400 text-[10px]">LP: ${wz.waybillNo || 'Brak'}</span>
                                        </td>
                                        <td class="p-3 text-white text-xs">
                                            <strong class="block">${wz.client}</strong>
                                            <span class="text-slate-400 text-[11px]">${wz.address}</span>
                                        </td>
                                        <td class="p-3 text-slate-300 text-xs">${wz.transport}</td>
                                        <td class="p-3 text-slate-300 text-xs">
                                            ${wz.items.map(i => `<span class="text-amber-400 font-mono font-bold">[${i.index}]</span> ${i.name} (${i.qty} ${i.unit}) – ${i.totalNetValue.toFixed(2)} zł`).join('<br>')}
                                        </td>
                                        <td class="p-3 text-xs text-slate-300">${wz.op1}, ${wz.op2}</td>
                                        <td class="p-3 space-y-1">
                                            <button onclick="printWZ('${wz.wzNumber}')" class="w-full bg-slate-700 hover:bg-slate-600 text-white text-xs px-2 py-1 rounded flex items-center justify-center gap-1 font-semibold">
                                                <i data-lucide="printer" class="w-3 h-3"></i> Drukuj WZ
                                            </button>
                                            <button onclick="printLabelOnly('${wz.wzNumber}')" class="w-full bg-purple-700 hover:bg-purple-600 text-white text-xs px-2 py-1 rounded flex items-center justify-center gap-1 font-semibold">
                                                <i data-lucide="tag" class="w-3 h-3"></i> Etykieta GS1
                                            </button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function printWZ(wzNumber) {
            const wz = wzHistory.find(w => w.wzNumber === wzNumber);
            if(!wz) return;

            const grandTotalNet = wz.items.reduce((sum, i) => sum + i.totalNetValue, 0);

            document.getElementById('modal-print-btn').style.display = 'flex';
            document.getElementById('print-content').innerHTML = `
                <div class="space-y-3 font-sans text-xs text-black bg-white p-2">
                    <div class="flex justify-between border-b border-black pb-2">
                        <div>
                            <h3 class="font-bold text-sm">Hurtownia Spożywcza „Smakołyk” Sp. z o.o.</h3>
                            <p class="text-[9px] text-gray-600">ul. Gdańska 25/34, 14-260 Lubawa | NIP: 744-785-12-10</p>
                        </div>
                        <div class="text-right">
                            <h2 class="text-base font-bold text-blue-800">DOKUMENT WZ</h2>
                            <p class="text-xs font-mono font-bold">${wz.wzNumber}</p>
                            <p class="text-[9px] text-gray-500">Data: ${wz.date}</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 bg-gray-100 p-2 rounded text-[11px]">
                        <div>
                            <span class="text-[9px] text-gray-500 block uppercase">Nabywca / Adres dostawy:</span>
                            <strong class="uppercase block">${wz.client}</strong>
                            <span class="text-[10px] text-gray-700">${wz.address}</span>
                        </div>
                        <div class="space-y-1">
                            <div>
                                <span class="text-[9px] text-gray-500 block uppercase">Zamówienie / List:</span>
                                <strong>${wz.orderNo}</strong> <span class="text-blue-800 font-mono text-[9px]">(LP: ${wz.waybillNo || 'Brak'})</span>
                            </div>
                            <div>
                                <span class="text-[9px] text-gray-500 block uppercase">Środek transportu:</span>
                                <strong class="text-blue-900">${wz.transport}</strong>
                            </div>
                        </div>
                    </div>
                    <table class="w-full text-left border-collapse border border-black">
                        <thead>
                            <tr class="bg-gray-200 text-black">
                                <th class="p-1.5 border border-black">Lp.</th>
                                <th class="p-1.5 border border-black">Indeks</th>
                                <th class="p-1.5 border border-black">Nazwa towaru</th>
                                <th class="p-1.5 border border-black">Regał (sztywny)</th>
                                <th class="p-1.5 border border-black">Ilość</th>
                                <th class="p-1.5 border border-black">Cena jedn. netto (z marżą)</th>
                                <th class="p-1.5 border border-black">Wartość netto</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${wz.items.map((i, idx) => `
                                <tr>
                                    <td class="p-1.5 border border-black">${idx + 1}</td>
                                    <td class="p-1.5 border border-black font-mono font-bold">${i.index}</td>
                                    <td class="p-1.5 border border-black font-bold">${i.name}</td>
                                    <td class="p-1.5 border border-black font-mono">${i.code}</td>
                                    <td class="p-1.5 border border-black font-bold text-blue-900">${i.qty} ${i.unit}</td>
                                    <td class="p-1.5 border border-black">${i.netPrice.toFixed(2)} zł</td>
                                    <td class="p-1.5 border border-black font-bold">${i.totalNetValue.toFixed(2)} zł</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    <div class="text-right font-bold text-sm pt-1">
                        Razem Wartość Netto WZ: <span class="text-blue-900">${grandTotalNet.toFixed(2)} zł</span>
                    </div>
                    <div class="bg-gray-100 p-1.5 rounded text-center text-[10px]">
                        <p class="text-gray-700">Nośnik: <strong>${wz.carrier}</strong> | Kod SSCC: <span class="font-mono">${wz.sscc}</span></p>
                    </div>
                    <div class="grid grid-cols-4 pt-4 gap-2 text-center text-[10px]">
                        <div class="border-t border-black pt-1">
                            <p class="font-bold">${wz.op1}</p>
                            <p class="text-gray-600 text-[9px]">Magazynier 1</p>
                        </div>
                        <div class="border-t border-black pt-1">
                            <p class="font-bold">${wz.op2}</p>
                            <p class="text-gray-600 text-[9px]">Magazynier 2</p>
                        </div>
                        <div class="border-t border-black pt-1">
                            <p class="font-bold">${wz.approver}</p>
                            <p class="text-gray-600 text-[9px]">Zatwierdził</p>
                        </div>
                        <div class="border-t border-black pt-1">
                            <p class="font-bold text-gray-400">&nbsp;</p>
                            <p class="text-gray-600 text-[9px]">Podpis Odbiorcy</p>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('print-modal').classList.add('hidden');
            document.getElementById('print-modal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closePrintModal() {
            document.getElementById('print-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
